<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV — Luca Panconi</title>
    <meta
      name="description"
      content="Curriculum vitae of Luca Panconi: education, employment, teaching, academic service and awards."
    />
    <link rel="icon" href="assets/img/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css?v=5" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var d =
            s === "dark" ||
            (s === null &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            d ? "dark" : "light"
          );
        } catch (e) {}
      })();
    </script>
    <script src="assets/data/content.js?v=5" defer></script>
    <script src="assets/js/site.js?v=5" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-render="nav"></header>

    <main id="main">
      <section class="section" style="border-top: 0">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Education</h2>
            <p class="section__lede">
              A condensed overview of my education, employment and academic
              activity.
            </p>
          </div>
          <div data-render="timeline" data-source="education"></div>
        </div>
      </section>

      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Employment</h2>
          </div>
          <div data-render="timeline" data-source="experience"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Conference talks and seminars</h2>
          </div>
          <div data-render="timeline" data-source="talks"></div>
        </div>
      </section>

      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Poster presentations</h2>
          </div>
          <div data-render="timeline" data-source="posters"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Teaching and supervision</h2>
          </div>
          <div data-render="timeline" data-source="teaching"></div>
        </div>
      </section>

      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Academic service and outreach</h2>
          </div>
          <div data-render="timeline" data-source="service"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section__head">
            <h2 class="section__title">Funding, awards and prizes</h2>
          </div>
          <div data-render="timeline" data-source="awards"></div>
        </div>
      </section>

      <section data-render="contact"></section>
    </main>

    <footer data-render="footer"></footer>
  </body>
</html>
