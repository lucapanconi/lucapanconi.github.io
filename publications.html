<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publications — Luca Panconi</title>
    <meta
      name="description"
      content="Peer-reviewed articles, preprints and books by Luca Panconi."
    />
    <link rel="icon" href="assets/img/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var d =
            s === "dark" ||
            (s === null &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            d ? "dark" : "light"
          );
        } catch (e) {}
      })();
    </script>
    <script src="assets/data/content.js" defer></script>
    <script src="assets/js/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header data-render="nav"></header>

    <main id="main">
      <section class="section" style="border-top: 0">
        <div class="container">
          <div class="section__head">
            <span class="section__eyebrow">Publications</span>
            <h2 class="section__title">Articles, preprints and books</h2>
            <p class="section__lede">
              Listed newest first. Titles link to the publisher record or
              preprint where one is available.
            </p>
          </div>
          <div data-render="publications"></div>
        </div>
      </section>

      <section class="section section--soft">
        <div class="container">
          <div class="section__head">
            <span class="section__eyebrow">Peer review</span>
            <h2 class="section__title">Manuscripts reviewed</h2>
          </div>
          <div data-render="reviewing"></div>
        </div>
      </section>
    </main>

    <footer data-render="footer"></footer>
  </body>
</html>
